<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="100%" height="100%">
  <defs>
    <linearGradient id="routerBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a323d" />
      <stop offset="50%" stop-color="#1e242c" />
      <stop offset="100%" stop-color="#12161b" />
    </linearGradient>
    <linearGradient id="antennaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#151a20" />
      <stop offset="40%" stop-color="#3b4452" />
      <stop offset="100%" stop-color="#181e26" />
    </linearGradient>
    <linearGradient id="basePlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111418" />
      <stop offset="100%" stop-color="#0a0c0e" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Antenna 1 (Far Left) -->
  <path d="M 52 110 L 46 22 Q 46 16 51 16 Q 56 16 56 22 L 62 110 Z" fill="url(#antennaGrad)" />
  <circle cx="51" cy="18" r="4" fill="#3b4452" />

  <!-- Antenna 2 (Inner Left) -->
  <path d="M 88 110 L 84 28 Q 84 22 89 22 Q 94 22 94 28 L 98 110 Z" fill="url(#antennaGrad)" />
  <circle cx="89" cy="24" r="4" fill="#3b4452" />

  <!-- Antenna 3 (Inner Right) -->
  <path d="M 142 110 L 146 28 Q 146 22 151 22 Q 156 22 156 28 L 152 110 Z" fill="url(#antennaGrad)" />
  <circle cx="151" cy="24" r="4" fill="#3b4452" />

  <!-- Antenna 4 (Far Right) -->
  <path d="M 178 110 L 184 22 Q 184 16 189 16 Q 194 16 194 22 L 188 110 Z" fill="url(#antennaGrad)" />
  <circle cx="189" cy="18" r="4" fill="#3b4452" />

  <!-- Router Base Shadow -->
  <ellipse cx="120" cy="158" rx="82" ry="12" fill="#000000" opacity="0.18" />

  <!-- Router Feet -->
  <rect x="58" y="148" width="14" height="6" rx="2" fill="#12161b" />
  <rect x="168" y="148" width="14" height="6" rx="2" fill="#12161b" />

  <!-- Main Router Body -->
  <g filter="url(#shadow)">
    <!-- Bottom Tier -->
    <path d="M 40 148 L 48 126 L 192 126 L 200 148 Q 202 152 196 152 L 44 152 Q 38 152 40 148 Z" fill="url(#basePlate)" />
    <!-- Top Shell -->
    <path d="M 36 126 L 46 102 Q 48 98 56 98 L 184 98 Q 192 98 194 102 L 204 126 Q 206 130 200 132 L 40 132 Q 34 130 36 126 Z" fill="url(#routerBody)" />
    <!-- Beveled Top Panel -->
    <polygon points="56,101 184,101 176,122 64,122" fill="#242c37" opacity="0.9" />
    <polygon points="68,104 172,104 166,119 74,119" fill="#181e26" />
  </g>

  <!-- Front Bevel Highlight -->
  <line x1="42" y1="130" x2="198" y2="130" stroke="#485466" stroke-width="1.2" opacity="0.6" />

  <!-- LED Indicator Lights -->
  <circle cx="100" cy="138" r="2.2" fill="#25D366" />
  <circle cx="108" cy="138" r="2.2" fill="#25D366" />
  <circle cx="116" cy="138" r="2.2" fill="#25D366" />
  <circle cx="124" cy="138" r="2.2" fill="#25D366" />
  <circle cx="132" cy="138" r="2.2" fill="#00d2ff" />
  <circle cx="140" cy="138" r="2.2" fill="#25D366" />

  <!-- Vent Grilles -->
  <g stroke="#12161a" stroke-width="1.2" opacity="0.5">
    <line x1="82" y1="108" x2="82" y2="116" />
    <line x1="88" y1="108" x2="88" y2="116" />
    <line x1="94" y1="108" x2="94" y2="116" />
    <line x1="146" y1="108" x2="146" y2="116" />
    <line x1="152" y1="108" x2="152" y2="116" />
    <line x1="158" y1="108" x2="158" y2="116" />
  </g>
</svg>
