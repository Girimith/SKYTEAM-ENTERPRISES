<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 60" width="100%" height="100%">
  <defs>
    <linearGradient id="logoRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E3B" />
      <stop offset="100%" stop-color="#D7141E" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Speed Fiber Waves Symbol -->
  <g transform="translate(6, 4)">
    <!-- Back Speed Trails -->
    <rect x="0" y="16" width="14" height="4.5" rx="2.25" fill="#FF2E3B" opacity="0.7" />
    <rect x="6" y="24" width="18" height="4.5" rx="2.25" fill="#FF2E3B" opacity="0.9" />
    <rect x="0" y="32" width="12" height="4.5" rx="2.25" fill="#FF2E3B" opacity="0.7" />

    <!-- Main Emblem / Dynamic 'S' & Fiber Arrow -->
    <path d="M 28 10 C 20 10, 16 16, 16 22 C 16 30, 36 28, 36 36 C 36 41, 30 43, 24 42 C 20 41, 18 38, 17 36 L 10 39 C 12 45, 17 48, 25 48 C 36 48, 44 43, 44 34 C 44 24, 24 26, 24 19 C 24 16, 28 15, 32 15 C 36 15, 39 17, 41 20 L 47 16 C 43 12, 37 10, 28 10 Z" fill="url(#logoRedGrad)" />

    <!-- Fiber Optic Speed Pulse -->
    <circle cx="46" cy="18" r="3.5" fill="#FF2E3B" />
    <path d="M 40 26 L 50 26" stroke="#D7141E" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(68, 0)">
    <text x="0" y="32" font-family="'Montserrat', 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" letter-spacing="1.5" fill="#1A1D20">SKYTEAM</text>
    <text x="1.5" y="47" font-family="'Montserrat', 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="700" font-size="11.5" letter-spacing="5.5" fill="#E51A24">ENTERPRISES</text>
  </g>
</svg>
